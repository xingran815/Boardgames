<title>Azul Tile School</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Learn to play Azul from zero: eight hands-on lessons, seven scoring puzzles and two quick-fire practice games.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: a glazed-tile workshop. A sticky header bar; each screen is a coach panel (what to do) above a
   table (factory displays, centre, your hand) and your player board. Side by side on wide screens, stacked on phones.
   Tile fills are fixed (docs/azul/STYLE.md); everything else is a theme token. */
:root {
  --bg: #edf1f8;
  --bg-2: #dfe6f2;
  --grout: rgba(31, 66, 140, 0.07);
  --panel: #ffffff;
  --panel-2: #eef2fa;
  --ink: #142449;
  --ink-2: #4b5b80;
  --line: #c3cee2;
  --edge: #8d9cbc;
  --accent: #1f55c0;
  --accent-ink: #ffffff;
  --accent-soft: #dbe5fb;
  --gold: #d29a10;
  --good: #11795a;
  --good-bg: #d8f2e8;
  --bad: #b5372f;
  --bad-bg: #fbe3e0;
  --board: #f6f1e7;
  --board-rim: #d9cdb5;
  --slot: #e7dfcf;
  --factory: #d9b38c;
  --factory-rim: #a87d52;
  --veil: rgba(16, 26, 54, 0.55);
  --t-blue: #2f6fb5;
  --t-yellow: #e8b730;
  --t-red: #c8423a;
  --t-black: #2a2d34;
  --t-white: #eef1f4;
  --t-white-rim: #9aa4b1;
  --t-mark-light: #ffffff;
  --t-mark-dark: #1d2330;
  --font-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --cell: clamp(24px, 6.4vw, 38px);
  --fcell: clamp(20px, 5.2vw, 30px);
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1528; --bg-2: #131e38; --grout: rgba(140, 170, 255, 0.06); --panel: #16213b; --panel-2: #1c2a4a;
    --ink: #e8eefb; --ink-2: #a6b4d4; --line: #2f4068; --edge: #08101f; --accent: #7aa2ff; --accent-ink: #0a1430;
    --accent-soft: #22335c; --gold: #f2c34b; --good: #52d3a3; --good-bg: #123b33; --bad: #ff8073; --bad-bg: #44202a;
    --board: #22304f; --board-rim: #34466f; --slot: #2b3a5d; --factory: #c9a27a; --factory-rim: #8e6943; --veil: rgba(3, 7, 18, 0.72);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1528; --bg-2: #131e38; --grout: rgba(140, 170, 255, 0.06); --panel: #16213b; --panel-2: #1c2a4a;
  --ink: #e8eefb; --ink-2: #a6b4d4; --line: #2f4068; --edge: #08101f; --accent: #7aa2ff; --accent-ink: #0a1430;
  --accent-soft: #22335c; --gold: #f2c34b; --good: #52d3a3; --good-bg: #123b33; --bad: #ff8073; --bad-bg: #44202a;
  --board: #22304f; --board-rim: #34466f; --slot: #2b3a5d; --factory: #c9a27a; --factory-rim: #8e6943; --veil: rgba(3, 7, 18, 0.72);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--grout) 1px, transparent 1px),
    linear-gradient(90deg, var(--grout) 1px, transparent 1px);
  background-size: 44px 44px;
  color: var(--ink);
  font: 16px/1.5 var(--font-body);
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--panel); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; font-family: var(--font-display); font-weight: 600; line-height: 1.15; }
p { margin: 0; }
b.w { color: var(--accent); }
.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- header ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; gap: 8px; padding-block: 8px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 600; font-size: 18px; flex: 1 1 auto; min-width: 0; }
.brand > span:nth-child(2) { white-space: nowrap; }
@media (max-width: 560px) { .brand .where { display: none; } }
.brand .where { color: var(--ink-2); font-weight: 500; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.brand-mark { display: inline-grid; grid-template-columns: repeat(2, 9px); gap: 2px; flex: none; }
.brand-mark i { width: 9px; height: 9px; border-radius: 2px; display: block; }

/* ---------- buttons ---------- */
.btn {
  font-family: var(--font-display); font-weight: 600; font-size: 16px; letter-spacing: 0.01em;
  background: var(--panel); color: var(--ink); border: 2px solid var(--line); border-radius: 10px;
  padding: 8px 16px; min-height: 44px; cursor: pointer; box-shadow: 0 3px 0 var(--line);
  transition: transform .08s, box-shadow .08s; touch-action: manipulation; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 55%, #000); }
.btn.small { font-size: 14px; padding: 5px 11px; min-height: 38px; }
.btn.ghost { background: transparent; box-shadow: none; border-color: transparent; }
.btn[disabled] { opacity: .5; cursor: default; }
.icon-btn { width: 42px; padding: 0; }
.row-btns { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* ---------- home ---------- */
.screen { padding-block: 18px 40px; }
.hero { display: grid; gap: 18px; padding-block: 18px 8px; }
@media (min-width: 860px) { .hero { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); align-items: center; } }
.hero h1 { font-size: clamp(36px, 7vw, 60px); font-weight: 700; letter-spacing: -0.01em; }
.hero h1 span { color: var(--accent); }
.hero .lede { font-size: 18px; color: var(--ink-2); max-width: 46ch; margin-top: 10px; }
.hero .row-btns { margin-top: 16px; }
.hero-tiles { display: grid; grid-template-columns: repeat(5, auto); gap: 6px; justify-content: center; padding: 18px;
  background: var(--board); border: 2px solid var(--board-rim); border-radius: 16px; width: max-content; max-width: 100%; justify-self: center; }
.hero-tiles .tile { --s: clamp(36px, 10vw, 54px); animation: settle .6s cubic-bezier(.3,1.4,.5,1) both; }
@keyframes settle { from { transform: translateY(-10px) scale(.85); } }
.map { display: grid; gap: 18px; margin-top: 26px; }
@media (min-width: 900px) { .map { grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; } }
.chapter { display: grid; gap: 10px; min-width: 0; }
.chhead { padding: 14px 16px; border-radius: var(--radius); background: var(--panel); border: 2px solid var(--line); display: grid; gap: 6px; }
.chhead .eyebrow { font-family: var(--font-display); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
.chhead h2 { font-size: 24px; }
.chhead p { color: var(--ink-2); font-size: 15px; }
.meter { height: 8px; border-radius: 99px; background: var(--bg-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--good); border-radius: 99px; transition: width .4s; }
.nodes { display: grid; gap: 8px; }
.node { width: 100%; display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; text-align: left;
  padding: 9px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--panel); cursor: pointer; box-shadow: 0 3px 0 var(--line); }
.node:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.node .n { grid-row: span 2; width: 40px; height: 40px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 600;
  border-radius: 9px; background: var(--panel-2); border: 2px solid var(--line); font-size: 17px; }
.node .nm { font-family: var(--font-display); font-weight: 600; font-size: 17px; line-height: 1.2; min-width: 0; }
.node .ds { color: var(--ink-2); font-size: 14px; line-height: 1.3; grid-column: 2; min-width: 0; }
.node .st { grid-row: span 2; grid-column: 3; font-size: 15px; color: var(--gold); white-space: nowrap; letter-spacing: 1px; }
.node.done .n { background: var(--good); border-color: var(--good); color: var(--panel); }
.node.next { border-color: var(--accent); }
.node.next .n { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.node.locked { opacity: .55; }
.locknote { display: grid; gap: 8px; padding: 12px 14px; border: 2px dashed var(--line); border-radius: 10px; font-size: 15px; color: var(--ink-2); }
.locknote .btn { justify-self: start; }
.foot { margin-top: 26px; color: var(--ink-2); font-size: 13px; display: grid; gap: 8px; }
.foot .row-btns { gap: 6px; }

/* ---------- lesson / puzzle layout ---------- */
.shead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 12px; }
.shead .eyebrow { font-family: var(--font-display); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); width: 100%; }
.shead h2 { font-size: clamp(22px, 4.4vw, 30px); flex: 1 1 auto; min-width: 0; }
.dots { display: flex; gap: 5px; flex-wrap: wrap; }
.dots i { width: 10px; height: 10px; border-radius: 3px; background: var(--line); display: block; }
.dots i.on { background: var(--accent); }
.dots i.done { background: var(--good); }
.coach { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 61px); z-index: 10; background: var(--panel); border: 2px solid var(--accent);
  border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 10px; box-shadow: 0 6px 18px -10px var(--veil); margin-bottom: 14px; }
.coach .say { font-size: 17px; line-height: 1.45; max-width: 70ch; }
.coach .say p + p { margin-top: 6px; }
.coach .msg { font-size: 15px; padding: 7px 10px; border-radius: 8px; background: var(--bad-bg); color: var(--ink); border-left: 4px solid var(--bad); }
.coach .msg.ok { background: var(--good-bg); border-left-color: var(--good); }
.coach .choices { display: flex; flex-wrap: wrap; gap: 8px; }
.coach .choices .btn { min-width: 56px; }
.coach .choices .btn.wrong { border-color: var(--bad); color: var(--bad); }
.coach .choices .btn.right { border-color: var(--good); background: var(--good-bg); }
@media (max-width: 640px) { .coach .say { font-size: 16px; } .coach { padding: 10px 12px; } }
.stage { display: grid; gap: 14px; }
@media (min-width: 920px) { .stage { grid-template-columns: auto minmax(0, 1fr); align-items: start; } .stage > .boardcol { order: -1; } }
.table { display: grid; gap: 12px; min-width: 0; align-content: start; }
.panel { background: var(--panel); border: 2px solid var(--line); border-radius: var(--radius); padding: 12px; min-width: 0; }
.ptitle { font-family: var(--font-display); font-weight: 600; font-size: 14px; color: var(--ink-2); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 8px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.ptitle .cnt { text-transform: none; letter-spacing: 0; font-weight: 500; }

/* ---------- tiles ---------- */
.tile { --s: var(--cell); width: var(--s); height: var(--s); border-radius: 18%; position: relative; display: inline-block; flex: none;
  background: var(--fill); color: var(--mark); box-shadow: inset 0 calc(var(--s) * -0.08) 0 rgba(0,0,0,.2), inset 0 calc(var(--s) * 0.05) 0 rgba(255,255,255,.25);
  vertical-align: middle; }
.tile svg { position: absolute; inset: 22%; width: 56%; height: 56%; display: block; }
.tile::after { content: attr(data-l); position: absolute; left: 7%; top: 2%; font: 700 calc(var(--s) * 0.3)/1 var(--font-body); }
.tile.c-blue { --fill: var(--t-blue); --mark: var(--t-mark-light); }
.tile.c-yellow { --fill: var(--t-yellow); --mark: var(--t-mark-dark); }
.tile.c-red { --fill: var(--t-red); --mark: var(--t-mark-light); }
.tile.c-black { --fill: var(--t-black); --mark: var(--t-mark-light); }
.tile.c-white { --fill: var(--t-white); --mark: var(--t-mark-dark); outline: 1.5px solid var(--t-white-rim); outline-offset: -1.5px; }
.tile.marker { --fill: var(--t-white); --mark: var(--t-mark-dark); outline: 2px solid var(--gold); outline-offset: -2px; display: inline-grid; place-items: center;
  font: 700 calc(var(--s) * .6)/1 var(--font-display); }
.tile.marker::after { content: none; }
.tile.ghost { opacity: .26; box-shadow: none; }
.tile.ghost::after { opacity: .9; }
.tile.sm { --s: var(--fcell); }
.tile.xs { --s: 22px; }
.tile.lift { transform: translateY(-4px); box-shadow: 0 0 0 3px var(--accent), 0 6px 10px -4px var(--veil); }
.hole { --s: var(--cell); width: var(--s); height: var(--s); border-radius: 18%; display: inline-block; border: 2px dashed var(--board-rim); background: var(--slot); flex: none; }

/* ---------- factories & centre ---------- */
.factories { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.factory { --d: calc(var(--fcell) * 2 + 26px); width: var(--d); height: var(--d); border-radius: 50%; background: var(--factory);
  border: 4px solid var(--factory-rim); display: grid; grid-template-columns: repeat(2, var(--fcell)); gap: 4px; align-content: center; justify-content: center;
  position: relative; padding: 0; box-shadow: inset 0 -4px 0 rgba(0,0,0,.12); }
.factory .fno { position: absolute; bottom: -9px; left: 50%; translate: -50% 0; font: 600 12px/1 var(--font-display); background: var(--panel); color: var(--ink-2);
  border: 1px solid var(--line); border-radius: 99px; padding: 2px 6px; }
.factory.empty { opacity: .8; }
button.factory, button.tilebtn, .tilebtn { cursor: pointer; }
.tilebtn { padding: 0; border: 0; background: none; border-radius: 18%; display: inline-block; line-height: 0; }
.tilebtn:disabled { cursor: default; }
.centre { display: flex; flex-wrap: wrap; gap: 5px; min-height: calc(var(--fcell) + 22px); align-items: center; align-content: center; justify-content: center;
  border-radius: 14px; border: 2px dashed var(--line); padding: 10px; background: var(--panel-2); }
.centre .none { color: var(--ink-2); font-size: 14px; }
.hand { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 44px; }
.hand .lbl { color: var(--ink-2); font-size: 15px; }
.hand .tiles { display: flex; gap: 4px; flex-wrap: wrap; }
.supply { display: flex; flex-wrap: wrap; gap: 10px; }
.pile { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel); font-size: 15px; min-height: 48px; }
button.pile { cursor: pointer; }
.pile .ico { width: 34px; height: 34px; display: block; flex: none; }
.pile .num { font-family: var(--font-display); font-weight: 600; font-variant-numeric: tabular-nums; }
.palette { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.palette .tilebtn .tile { --s: 48px; }
.palette figure { margin: 0; display: grid; justify-items: center; gap: 4px; font-size: 14px; color: var(--ink-2); }

/* ---------- player board ---------- */
.pboard { background: var(--board); border: 3px solid var(--board-rim); border-radius: 16px; padding: 10px; display: grid; gap: 10px; width: max-content; max-width: 100%; justify-self: center; }
.pb-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pb-top .who { font-family: var(--font-display); font-weight: 600; font-size: 15px; color: var(--ink-2); }
.scorebox { display: inline-flex; align-items: baseline; gap: 6px; font-family: var(--font-display); font-weight: 600; padding: 3px 10px; border-radius: 8px; background: var(--panel); border: 2px solid var(--board-rim); }
.scorebox .v { font-size: 20px; font-variant-numeric: tabular-nums; min-width: 2ch; text-align: right; }
.scorebox .k { font-size: 13px; color: var(--ink-2); }
.pb-main { display: grid; grid-template-columns: auto auto auto; gap: 6px; align-items: start; }
.lines, .wall { display: grid; gap: 3px; }
.pline { display: flex; justify-content: flex-end; gap: 3px; padding: 0; border: 0; background: none; border-radius: 6px; position: relative; }
button.pline { cursor: pointer; }
button.pline:hover .hole, button.pline:focus-visible .hole { border-color: var(--accent); }
.pline .lno { position: absolute; left: 0; top: 50%; translate: 0 -50%; font: 600 12px/1 var(--font-display); color: var(--ink-2); }
.wall { grid-template-columns: repeat(5, var(--cell)); padding-left: 6px; border-left: 2px solid var(--board-rim); }
.wcell { padding: 0; border: 0; background: none; line-height: 0; border-radius: 18%; position: relative; }
button.wcell { cursor: pointer; }
.wcell.ring::before { content: ""; position: absolute; inset: -3px; border: 3px dashed var(--accent); border-radius: 24%; z-index: 1; }
.wcell.run-h .tile, .wcell.run-v .tile { box-shadow: 0 0 0 3px var(--gold); }
.wcell.pick .tile { box-shadow: 0 0 0 3px var(--good); }
.floor { display: grid; grid-template-columns: repeat(7, var(--cell)); gap: 3px; padding: 0; border: 0; background: none; justify-content: start; }
button.floor { cursor: pointer; }
.floorwrap { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 8px; align-items: center; }
.floorwrap .flabel { font: 600 12px/1.1 var(--font-display); color: var(--ink-2); text-transform: uppercase; letter-spacing: .05em; }
.fspace { display: grid; gap: 2px; justify-items: center; }
.fspace .pen { font: 600 12px/1 var(--font-display); color: var(--bad); font-variant-numeric: tabular-nums; }
.area { outline: 0; }
button.area { cursor: pointer; padding: 0; border: 0; background: none; border-radius: 8px; text-align: inherit; }
button.area:hover, button.area:focus-visible { box-shadow: 0 0 0 3px var(--accent-soft); }
.hl { box-shadow: 0 0 0 3px var(--gold) !important; border-radius: 8px; }

/* goal pulse: where to look */
.goal { animation: goal 1.4s ease-in-out infinite; border-radius: 10px; }
@keyframes goal { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 0%, transparent); } 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 55%, transparent); } }
.factory.goal { border-radius: 50%; }
.tilebtn.goal { border-radius: 18%; }

/* ---------- result / remember cards ---------- */
.card { background: var(--panel); border: 2px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; }
.remember { border-color: var(--gold); }
.remember h3 { font-size: 24px; display: flex; align-items: center; gap: 10px; }
.remember ul { margin: 0; padding-left: 22px; display: grid; gap: 6px; font-size: 17px; }
.maths { display: grid; gap: 4px; font-variant-numeric: tabular-nums; }
.maths .ln { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-bottom: 1px dashed var(--line); }
.maths .ln span:last-child { font-family: var(--font-display); font-weight: 600; white-space: nowrap; }
.maths .ln.tot { border-bottom: 0; font-weight: 700; }
.stars { font-size: 28px; letter-spacing: 4px; color: var(--gold); line-height: 1; }
.stars .off { color: var(--line); }
.verdict { font-family: var(--font-display); font-size: 24px; font-weight: 600; }
.why { color: var(--ink-2); }
.cols2 { display: grid; gap: 14px; }
@media (min-width: 760px) { .cols2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.cols2 h4 { margin: 0 0 4px; font-family: var(--font-display); font-weight: 600; font-size: 16px; }
.tag { display: inline-block; font: 600 12px/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; padding: 4px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }

/* bridge */
.bridge { display: grid; gap: 14px; max-width: 760px; }
.bridge ol { margin: 0; padding-left: 22px; display: grid; gap: 8px; font-size: 17px; }

/* ---------- quick-fire ---------- */
.hud { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.hud .chip { padding: 6px 12px; border-radius: 99px; background: var(--panel); border: 2px solid var(--line); font-family: var(--font-display); font-weight: 600; font-variant-numeric: tabular-nums; }
@media (max-width: 480px) { .hud .chip { font-size: 14px; padding: 4px 9px; } .hud { gap: 6px; } }
.hud .lives { color: var(--bad); letter-spacing: 2px; }
.timer { height: 10px; border-radius: 99px; background: var(--bg-2); overflow: hidden; margin-bottom: 12px; }
.timer i { display: block; height: 100%; background: var(--accent); width: 100%; transform-origin: left; }
.qbox { --cell: clamp(28px, 8.4vw, 44px); display: grid; gap: 14px; justify-items: center; }

<script>
/* Core: save, sound, rendering of tiles / table / board, animated table actions, rules overlay, navigation. */
(function () {
  "use strict";
  var E = window.AzulEngine;
  var AZ = window.AZ = {};
  var LET = E.LETTERS;
  var $ = AZ.$ = function (s, el) { return (el || document).querySelector(s); };
  var $$ = AZ.$$ = function (s, el) { return Array.prototype.slice.call((el || document).querySelectorAll(s)); };
  var reduced = AZ.reduced = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  AZ.ABORT = { abort: true };

  function w(t) { return '<b class="w">' + t + "</b>"; }

  AZ.sign = function (n) { return n > 0 ? "+" + n : n < 0 ? "−" + Math.abs(n) : "0"; };
  AZ.minus = function (n) { return "−" + Math.abs(n); };

  AZ.sleep = function (ms) { return new Promise(function (r) { setTimeout(r, reduced ? Math.min(ms, 60) : ms); }); };

  /* ---------------- save (per-viewer convenience only) ---------------- */
  var Save = AZ.Save = {
    key: "azul-tile-school-v1",
    data: { lessons: {}, stars: {}, rush: { tile: 0, floor: 0 }, muted: false, skipped: false, bridgeSeen: false },
    load: function () {
      try { var r = localStorage.getItem(this.key); if (r) { var d = JSON.parse(r); if (d && typeof d === "object") { Object.assign(this.data, d); this.data.rush = Object.assign({ tile: 0, floor: 0 }, d.rush || {}); } } } catch (e) { /* storage unavailable */ }
    },
    save: function () { try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) { /* storage unavailable */ } },
    reset: function () { this.data = { lessons: {}, stars: {}, rush: { tile: 0, floor: 0 }, muted: this.data.muted, skipped: false, bridgeSeen: false }; this.save(); }
  };
  Save.load();

  /* ---------------- sound (Web Audio, starts after a tap) ---------------- */
  var Snd = AZ.Snd = {
    ctx: null,
    ensure: function () {
      if (this.ctx || Save.data.muted) return;
      try { var C = window.AudioContext || window.webkitAudioContext; if (C) this.ctx = new C(); } catch (e) { this.ctx = null; }
    },
    tone: function (f, dur, type, vol, delay, f2) {

      try {
        if (c.state === "suspended") c.resume();
        var t = c.currentTime + (delay || 0), o = c.createOscillator(), g = c.createGain();
        o.type = type || "sine"; o.frequency.setValueAtTime(f, t);
        if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.06, t + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
      } catch (e) { /* ignore */ }
    },
    play: function (n, x) {
      var T = this.tone.bind(this);
      switch (n) {
        case "tap": T(660, 0.06, "triangle", 0.05); break;
        case "clack": T(1400, 0.035, "square", 0.025); T(900, 0.05, "triangle", 0.04, 0.03); break;
        case "slide": T(300, 0.18, "sine", 0.04, 0, 520); break;
        case "place": T(520, 0.07, "triangle", 0.06); T(780, 0.08, "triangle", 0.05, 0.05); break;
        case "score": var k = Math.min(x || 1, 8); for (var i = 0; i < k; i++) T(523 * Math.pow(1.122, i), 0.09, "triangle", 0.05, i * 0.055); break;
        case "lose": T(392, 0.16, "sawtooth", 0.025); T(294, 0.22, "sawtooth", 0.025, 0.12); break;
        case "wrong": T(180, 0.16, "square", 0.03); T(150, 0.18, "square", 0.03, 0.08); break;
        case "ok": T(784, 0.08, "triangle", 0.05); T(1047, 0.12, "triangle", 0.05, 0.07); break;
        case "star": T(1047, 0.1, "triangle", 0.05, x || 0); T(1568, 0.14, "triangle", 0.04, (x || 0) + 0.06); break;
        case "win": [523, 659, 784, 1047, 784, 1047].forEach(function (f, i) { T(f, 0.14, "triangle", 0.05, i * 0.08); }); break;
        case "tick": T(1200, 0.03, "square", 0.015); break;
        case "over": [392, 349, 311, 262].forEach(function (f, i) { T(f, 0.2, "triangle", 0.05, i * 0.14); }); break;
      }
    }
  };
  function syncMute() {
    var b = $("#muteBtn"), m = Save.data.muted;
    b.setAttribute("aria-pressed", m ? "true" : "false");
    b.setAttribute("aria-label", m ? "Sound off. Press to turn sound on." : "Sound on. Press to mute.");
    b.innerHTML = m ? '<span aria-hidden="true" style="text-decoration:line-through">&#9835;</span>' : '<span aria-hidden="true">&#9835;</span>';
  }
  AZ.syncMute = syncMute;

  AZ.say = function (t) { var l = $("#live"); l.textContent = ""; setTimeout(function () { l.textContent = t.replace(/<[^>]+>/g, ""); }, 30); };

  /* ---------------- tile HTML ---------------- */
  function tileHTML(c, o) {
    o = o || {};
    var cls = "tile c-" + c + (o.cls ? " " + o.cls : "");
    var lab = o.label === false ? ' aria-hidden="true"' : ' role="img" aria-label="' + (o.ghost ? "empty space for " : "") + c + ' tile"';
    return '<span class="' + cls + '" data-l="' + LET[c] + '"' + (o.k ? ' data-k="' + o.k + '"' : "") + lab +
      '><svg aria-hidden="true" focusable="false"><use href="#mk-' + c + '"/></svg></span>';
  }
  function markerHTML(o) {
    o = o || {};
    return '<span class="tile marker' + (o.cls ? " " + o.cls : "") + '"' + (o.k ? ' data-k="' + o.k + '"' : "") +
      (o.label === false ? ' aria-hidden="true"' : ' role="img" aria-label="starting player marker"') + ">1</span>";
  }
  function itemHTML(x, o) { return x === E.MARKER ? markerHTML(o) : tileHTML(x, o); }
  AZ.tileHTML = tileHTML; AZ.markerHTML = markerHTML; AZ.itemHTML = itemHTML;

  /* ---------------- table + board HTML ---------------- */
  function factoriesHTML(st, o) {
    return '<div class="factories">' + st.factories.map(function (f, i) {
      var inner = f.map(function (c, j) {
        var k = "f" + i + "-" + j;
        if (o.takeable) return '<button type="button" class="tilebtn" data-act="take" data-src="' + i + '" data-colour="' + c + '" aria-label="Take ' + c + ' from factory display ' + (i + 1) + '">' + tileHTML(c, { cls: "sm", k: k, label: false }) + "</button>";
        return tileHTML(c, { cls: "sm", k: k });
      }).join("");
      var open = "div", attrs = "";
      if (o.factoryBtn) { open = "button"; attrs = ' type="button" data-act="fac" data-i="' + i + '" aria-label="Factory display ' + (i + 1) + ", " + AZ.plural(f.length, "tile") + '"'; }
      else if (o.takeable && !f.length) { open = "button"; attrs = ' type="button" data-act="emptyfac" data-i="' + i + '" aria-label="Factory display ' + (i + 1) + ', empty"'; }
      var need = o.factoryBtn && f.length < E.TILES_PER_FACTORY ? " need" : "";
      return "<" + open + attrs + ' class="factory' + (f.length ? "" : " empty") + (o.factoryBtn ? need : "") + '" data-k="fd' + i + '">' + inner + '<span class="fno" aria-hidden="true">' + (i + 1) + "</span></" + open + ">";
    }).join("") + "</div>";
  }
  function centreHTML(st, o) {
    var h = "";
    if (st.centre_marker) h += o.takeable ? '<button type="button" class="tilebtn" data-act="marker" aria-label="Starting player marker">' + markerHTML({ cls: "sm", k: "cm", label: false }) + "</button>" : markerHTML({ cls: "sm", k: "cm" });
    st.centre.forEach(function (c, j) {
      var k = "c" + j;
      h += o.takeable ? '<button type="button" class="tilebtn" data-act="take" data-src="centre" data-colour="' + c + '" aria-label="Take ' + c + ' from the centre">' + tileHTML(c, { cls: "sm", k: k, label: false }) + "</button>" : tileHTML(c, { cls: "sm", k: k });
    });
    if (!h) h = '<span class="none">empty</span>';
    return '<div class="centre" data-k="centre" aria-label="Centre of the table">' + h + "</div>";
  }
  function handHTML(hand) {
    var h = '<div class="hand" aria-label="In your hand"><span class="lbl">In your hand:</span><span class="tiles">';
    if (hand && hand.n) {
      for (var q = 0; q < hand.n; q++) h += tileHTML(hand.colour, { cls: "sm", k: "h" + q });
      if (hand.marker) h += markerHTML({ cls: "sm", k: "hm" });
      h += '</span><span class="lbl"><b>' + hand.n + " " + hand.colour + "</b>" + (hand.marker ? " and the starting player marker" : "") + "</span>";
    } else h += '</span><span class="lbl">nothing</span>';
    return h + "</div>";
  }
  function supplyHTML(o) {
    var s = o.supply, h = '<div class="supply">';
    if (s.bag !== undefined) {
      var tb = s.bagBtn ? 'button type="button" data-act="bag"' : "div";
      h += "<" + tb + ' class="pile" data-k="bag"><svg class="ico" aria-hidden="true"><use href="#ico-bag"/></svg><span>Bag <span class="num">' + s.bag + "</span></span></" + tb.split(" ")[0] + ">";
    }
    if (s.lid !== undefined) {
      var tl = s.lidBtn ? 'button type="button" data-act="lid"' : "div";
      h += "<" + tl + ' class="pile" data-k="lid"><svg class="ico" aria-hidden="true"><use href="#ico-lid"/></svg><span>Box lid <span class="num">' + s.lid + "</span></span></" + tl.split(" ")[0] + ">";
    }
    if (s.marker) {
      h += s.markerBtn ? '<button type="button" class="pile" data-act="marker" aria-label="Starting player marker">' + markerHTML({ k: "ma", label: false }) + "<span>Starting player marker</span></button>"
        : '<div class="pile">' + markerHTML({ k: "ma" }) + "<span>Starting player marker</span></div>";
    }
    return h + "</div>";
  }

  function lineLabel(b, i) {
    var pl = b.lines[i], cap = i + 1;
    return "Pattern line " + (i + 1) + ": " + (pl.count ? pl.count + " " + pl.colour + " of " + cap : "empty, " + AZ.plural(cap, "space"));
  }
  function boardHTML(b, o) {
    o = o || {};
    var marks = o.marks || {}, i, r, c;
    var key = function (r, c) { return r + "," + c; };
    var ring = marks.ring ? key(marks.ring[0], marks.ring[1]) : null, runH = {}, runV = {}, pick = {};
    (marks.h || []).forEach(function (p) { runH[key(p[0], p[1])] = 1; });
    (marks.v || []).forEach(function (p) { runV[key(p[0], p[1])] = 1; });
    (marks.pick || []).forEach(function (p) { pick[key(p[0], p[1])] = 1; });
    var linesH = "", numsH = "";
    for (i = 0; i < 5; i++) {
      var pl = b.lines[i], cap = i + 1, cells = "";
      for (var pos = 0; pos < cap; pos++) {
        var slot = cap - 1 - pos, k = "l" + i + "-" + slot;
        cells += slot < pl.count ? tileHTML(pl.colour, { k: k, label: false }) : '<span class="hole" data-k="' + k + '" aria-hidden="true"></span>';
      }
      var hl = o.hlLines && o.hlLines.indexOf(i) >= 0 ? " hl" : "";
      if (o.linesActive) linesH += '<button type="button" class="pline' + hl + '" data-act="line" data-line="' + i + '" aria-label="' + lineLabel(b, i) + '">' + cells + "</button>";
      else linesH += '<div class="pline' + hl + '" role="img" aria-label="' + lineLabel(b, i) + '">' + cells + "</div>";
      numsH += '<span class="lno" style="height:var(--cell);display:flex;align-items:center;font:600 12px/1 var(--font-display);color:var(--ink-2)" aria-hidden="true">' + (i + 1) + "</span>";
    }
    var wallH = "";
    for (r = 0; r < 5; r++) for (c = 0; c < 5; c++) {
      var t = b.wall[r][c], wc = E.wallColour(r, c), kk = key(r, c);
      var cls = "wcell" + (ring === kk ? " ring" : "") + (runH[kk] ? " run-h" : "") + (runV[kk] ? " run-v" : "") + (pick[kk] ? " pick" : "");
      var inner = t ? tileHTML(t, { label: false }) : tileHTML(wc, { cls: "ghost", label: false });
      var lab = "Wall row " + (r + 1) + ", column " + (c + 1) + ": " + wc + (t ? ", tiled" : ", empty");
      if (o.wallActive) wallH += '<button type="button" class="' + cls + '" data-act="wall" data-r="' + r + '" data-c="' + c + '" data-k="w' + r + "-" + c + '" aria-label="' + lab + '">' + inner + "</button>";
      else wallH += '<span class="' + cls + '" data-k="w' + r + "-" + c + '" data-r="' + r + '" data-c="' + c + '"' + (t ? ' data-t="1"' : "") + ' role="img" aria-label="' + lab + '">' + inner + "</span>";
    }
    var floorH = "";
    for (i = 0; i < E.FLOOR_SPACES; i++) {
      var it = b.floor[i];
      floorH += '<span class="fspace">' + (it ? itemHTML(it, { k: "fl" + i, label: false }) : '<span class="hole" data-k="fl' + i + '"></span>') + '<span class="pen">' + AZ.minus(E.FLOOR_VALUES[i]) + "</span></span>";
    }
    var floorLab = "Floor line: " + AZ.plural(b.floor.length, "item") + " of " + E.FLOOR_SPACES;
    var floorBox = o.floorActive ? '<button type="button" class="floor" data-act="floor" aria-label="' + floorLab + '">' + floorH + "</button>" : '<div class="floor" role="img" aria-label="' + floorLab + '">' + floorH + "</div>";
    var A = function (name, inner, label) { return o.areas ? '<button type="button" class="area" data-act="area" data-area="' + name + '" aria-label="' + label + '">' + inner + "</button>" : inner; };
    var scoreH = '<span class="scorebox" data-k="score"><span class="k">Score</span><span class="v">' + b.score + "</span></span>";
    var top = '<div class="pb-top"><span class="who">' + (o.who || "Your board") + (o.markerMine ? " " + markerHTML({ cls: "xs", k: "pbm" }) : "") + "</span>" + A("score", scoreH, "Score track") + "</div>";
    var wallBox = '<div class="wall" data-k="wall">' + wallH + "</div>";
    if (o.only === "wall") return '<div class="pboard">' + (o.noTop ? "" : top) + wallBox + "</div>";
    if (o.only === "floor") return '<div class="pboard"><div class="floorwrap"><span class="flabel">Floor<br>line</span>' + floorBox + "</div></div>";
    return '<div class="pboard" data-k="board">' + top +
      '<div class="pb-main"><div style="display:grid;gap:3px">' + numsH + "</div>" + A("lines", '<div class="lines">' + linesH + "</div>", "Pattern lines") + A("wall", wallBox, "Wall") + "</div>" +
      A("floor", '<div class="floorwrap"><span class="flabel">Floor<br>line</span>' + floorBox + "</div>", "Floor line") + "</div>";
  }
  AZ.boardHTML = boardHTML;
  AZ.factoriesHTML = factoriesHTML;

  function paletteHTML(o) {
    return '<div class="palette">' + E.COLOURS.map(function (c) {
      var t = tileHTML(c, { k: "pal-" + c, label: false });
      return "<figure>" + (o.paletteActive ? '<button type="button" class="tilebtn" data-act="pal" data-colour="' + c + '" aria-label="' + c + ' tile, letter ' + LET[c] + '">' + t + "</button>" : t) +
        "<figcaption>" + c + " " + LET[c] + "</figcaption></figure>";
    }).join("") + "</div>";
  }

  /* ---------------- Table: a state + view with animated actions ---------------- */
  function Table(host, st, opt) {
    this.host = host; this.st = st; this.opt = opt || {}; this.hand = null; this.goal = null; this.extraMarks = null;
  }
  AZ.Table = Table;
  Table.prototype.board = function () { return this.st.boards[this.st.current]; };
  Table.prototype.html = function () {
    var o = this.opt, st = this.st, t = "", panels = [];
    if (o.palette) panels.push('<div class="panel"><div class="ptitle">Tiles: 20 of each colour</div>' + paletteHTML(o) + "</div>");
    if (o.factories) {
      var showCentre = o.centre !== false, hasF = st.factories.length > 0;
      panels.push('<div class="panel">' + (hasF ? '<div class="ptitle"><span>Factory displays</span><span class="cnt">' + st.factories.length + "</span></div>" + factoriesHTML(st, o) : "") +
        (showCentre ? '<div class="ptitle"' + (hasF ? ' style="margin-top:14px"' : "") + ">Centre of the table</div>" + centreHTML(st, o) : "") + "</div>");
    }
    if (o.hand) panels.push('<div class="panel">' + handHTML(this.hand) + "</div>");
    if (o.supply) panels.push(supplyHTML(o));
    if (o.note) panels.push('<div class="panel">' + o.note + "</div>");
    t += '<div class="table">' + panels.join("") + "</div>";
    if (o.board !== false) {
      var bo = Object.assign({}, o.boardOpt || {});
      ["linesActive", "floorActive", "wallActive", "areas", "markerMine", "only", "who", "hlLines"].forEach(function (k) { if (o[k] !== undefined) bo[k] = o[k]; });
      if (this.extraMarks) bo.marks = this.extraMarks;
      t += '<div class="boardcol" style="display:grid;min-width:0">' + boardHTML(this.board(), bo) + "</div>";
    }
    return t;
  };
  Table.prototype.render = function () {
    this.host.innerHTML = this.html();
    if (this.opt.board === false || (this.opt.factories === undefined && !this.opt.palette && !this.opt.hand && !this.opt.supply)) this.host.style.gridTemplateColumns = "minmax(0,1fr)";
    else this.host.style.gridTemplateColumns = "";
    this.applyGoal();
  };
  Table.prototype.applyGoal = function () {
    $$(".goal", this.host).forEach(function (e) { e.classList.remove("goal"); });
    if (this.goal) $$(this.goal, this.host).forEach(function (e) { e.classList.add("goal"); });
  };
  Table.prototype.rects = function (keys) {
    var m = {}, host = this.host;
    keys.forEach(function (k) { var el = host.querySelector('[data-k="' + k + '"]'); if (el) m[k] = el.getBoundingClientRect(); });
    return m;
  };
  /* moves: [{from: key, to: key, html}] with rects captured before the change */
  Table.prototype.fly = function (moves, rects) {
    var host = this.host;
    if (reduced || !moves.length) return Promise.resolve();
    return new Promise(function (resolve) {
      var left = 0;
      moves.forEach(function (m, i) {
        var fr = rects[m.from], t = host.querySelector('[data-k="' + m.to + '"]');
        if (!fr || !t) return;
        var tr = t.getBoundingClientRect();
        if (!tr.width) return;
        left++;
        t.style.visibility = "hidden";
        var d = document.createElement("div");

        : '<button class="btn primary" type="button" id="lnNext">Next: ' + LESSONS[idx + 1].title + " &#8594;</button>") +
      '<button class="btn" type="button" id="lnAgain">Play this lesson again</button><button class="btn ghost" type="button" id="lnMap">Back to the map</button></div></div>';
    Snd.play("win");
    var f = $("#lnCh2") || $("#lnNext"); if (f) f.focus();
  };

  function areaWrong(a) {
    return { lines: "That's the pattern lines: the staircase of rows on the left.", wall: "That's the wall: the 5 by 5 grid.",
      floor: "That's the floor line, along the bottom.", score: "That's your score." }[a.area];
  }
  function wantArea(name) { return function (a) { return a.kind === "area" ? (a.area === name || areaWrong(a)) : false; }; }
  function lineAct(T, target, extra) {
    return function (a) {
      if (a.kind === "floor") return extra && extra.floor ? extra.floor : "That's allowed, but those tiles would cost points. Use pattern line " + (target + 1) + ".";
      if (a.kind !== "line") return false;
      var b = T.table.board(), h = T.table.hand, why = AZ.placeMsg(b, a.line, h.colour);
      if (why) return why;
      if (a.line === target) return true;
      if (extra && extra[a.line]) return extra[a.line];
      var room = a.line + 1 - b.lines[a.line].count, spill = h.n - room;
      if (spill > 0) return "That's allowed, but pattern line " + (a.line + 1) + " has room for only " + AZ.plural(room, "tile") + ". " + AZ.cap(AZ.plural(spill, "tile")) + " would spill onto the floor line. Use pattern line " + (target + 1) + ".";
      return "That's allowed too, but for this lesson use pattern line " + (target + 1) + ".";
    };
  }
  function floorChoice(n) {
    var lost = -E.floorPenalty(n);
    var cands = [n, -E.floorPenalty(n + 1), -E.floorPenalty(Math.max(1, n - 1)), lost + 1];
    return AZ.numOptions(lost, cands).map(function (v) {
      return { label: String(v), ok: v === lost, why: v === lost ? "Yes: " + AZ.floorText(n) + "." : "Add the numbers under the filled spaces, from the left." };
    });
  }
  function scoreChoice(d, wrongWhy) {
    var cands = [d.h + d.v - 1, d.h > 1 ? d.h : 0, d.v > 1 ? d.v : 0, d.points + 1, d.points - 1];
    return AZ.numOptions(d.points, cands).map(function (v) {
      var why;
      if (v === d.points) why = "Yes: " + AZ.detailText(d) + ".";
      else if (d.h > 1 && d.v > 1 && v === d.h + d.v - 1) why = "Close. The new tile counts in both lines, so it is counted twice.";
      else if (d.h > 1 && d.v > 1 && (v === d.h || v === d.v)) why = "It touches tiles across and down. Count both lines and add them.";
      else why = wrongWhy;
      return { label: String(v), ok: v === d.points, why: why };
    });
  }
  function wallSpaceAct(T, row, colour) {
    var col = E.wallColumn(row, colour);
    return function (a) {
      if (a.kind !== "wall") return false;
      if (a.r !== row) return "The tile from pattern line " + (row + 1) + " goes into row " + (row + 1) + " of the wall, the row right beside it.";
      if (T.table.board().wall[a.r][a.c]) return "That space already has a tile.";
      if (a.c !== col) return "That space is for " + E.wallColour(a.r, a.c) + ". The " + colour + " tile goes on the " + colour + " space.";
      return true;
    };
  }

  /* ---------------- the eight lessons ---------------- */
  var LESSONS = AZ.LESSONS = [
    { id: "l1", title: "What's in the box", blurb: "Tiles, factory displays and your player board.",
      run: async function (T) {
        T.scene({ factories: [[]], board: E.newBoard() }, { palette: true, factories: true, centre: false, supply: { bag: TOTAL } });
        T.say("<p>Azul is a game about decorating a palace wall with " + w("tiles") + ". A tile is a small square piece.</p><p>There are " + TOTAL + " tiles: " + E.TILES_PER_COLOUR + " in each of 5 colours.</p>");
        await T.next();
        T.table.opt.paletteActive = true; T.render();
        T.say("Each colour has a letter and a mark, so you never need to tell colours apart by colour alone. Tap the <b>red</b> tile. Its letter is R and its mark is a diamond.");
        var a = await T.act(function (a) { return a.kind === "pal" ? (a.colour === "red" || "That is the " + a.colour + " tile, letter " + LET[a.colour] + ". Red has the letter R and a diamond.") : false; }, '[data-act="pal"][data-colour="red"]');
        T.msg("Right: red, letter R.", true);
        T.say("Now tap the <b>black</b> tile. Its letter is K, because B already means blue.");
        await T.act(function (a) { return a.kind === "pal" ? (a.colour === "black" || "That is the " + a.colour + " tile, letter " + LET[a.colour] + ". Black has the letter K and a plus sign.") : false; }, '[data-act="pal"][data-colour="black"]');
        T.table.opt.paletteActive = false; T.render();
        T.say("<p>All tiles start in the " + w("bag") + ". To " + w("draw") + " means to reach into the bag without looking and take tiles out.</p><p>Tiles are offered on round cardboard discs called " + w("factory displays") + ".</p>");
        await T.next();
        T.table.opt.areas = true; T.render();
        T.say("This is your " + w("player board") + ". Every player has the same board. Tap the " + w("pattern lines") + ": the five rows on the left, shaped like a staircase. Tiles you collect wait here.");
        await T.act(wantArea("lines"), '[data-area="lines"]');
        T.say("Tap the " + w("wall") + ": the 5 by 5 grid on the right. Each space shows the colour of the tile that belongs there. Tiles on the wall score points.");
        await T.act(wantArea("wall"), '[data-area="wall"]');
        T.say("Tap the " + w("floor line") + ": the seven spaces along the bottom. Tiles you can't use land here, and each space costs the points printed under it.");
        await T.act(wantArea("floor"), '[data-area="floor"]');
        T.say("Tap your " + w("score") + ". On the real board this is the " + w("score track") + " around the edge, where a marker counts your points.");
        await T.act(wantArea("score"), '[data-area="score"]');
        T.table.opt.areas = false; T.render();
        T.say("<p><b>The goal:</b> collect tiles, fill your pattern lines, and move tiles onto your wall for points. The player with the most points at the end wins.</p>");
        await T.next("Finish lesson");
        T.remember([TOTAL + " tiles in 5 colours, each with a letter: B blue, Y yellow, R red, K black, W white.",
          "Your board: pattern lines on the left, the wall on the right, the floor line at the bottom.",
          "Tiles on the wall score points. Most points wins."]);
      } },

    { id: "l2", title: "Set up the table", blurb: "Count the factory displays and fill them.",
      run: async function (T) {
        T.scene({ factories: [], board: E.newBoard() }, { supply: { bag: TOTAL } });
        T.say("Let's set up a game. First: how many players?");
        var n = await T.choose([2, 3, 4].map(function (k) { return { label: k + " players", ok: true, value: k }; }));
        var bag = shuffled(TOTAL);
        T.table.st.factories = []; for (var i = 0; i < F[n]; i++) T.table.st.factories.push([]);
        T.table.opt = { factories: true, centre: false, supply: { bag: bag.length, marker: true }, who: "Your board" };
        T.render();
        T.say("With " + n + " players you use " + w(F[n] + " factory displays") + ". (2 players: " + F[2] + ", 3 players: " + F[3] + ", 4 players: " + F[4] + ".) Put them in a ring in the middle of the table.");
        await T.next();
        T.say("<p>Every player takes a player board. <b>Everyone uses the same side</b>: the coloured side. Every board is identical.</p><p>Each player's score starts at 0.</p>");
        await T.next();
        T.table.opt.factoryBtn = true; T.render();
        T.say("All " + TOTAL + " tiles go in the bag. Now fill the factory displays: tap each one to draw " + PER + " tiles from the bag onto it.");
        var filled = 0;
        while (filled < F[n]) {
          var a = await T.act(function (a) { return a.kind === "fac" ? (T.table.st.factories[a.i].length >= PER ? "That display already has " + PER + " tiles. Each factory display gets exactly " + PER + "." : true) : false; }, '[data-act="fac"].need');
          await T.table.fillFactory(a.i, bag); T.check();
          filled++;
          T.msg(filled < F[n] ? filled + " of " + F[n] + " filled." : "All " + F[n] + " displays have " + PER + " tiles each.", true);
        }
        T.table.opt.factoryBtn = false; T.table.opt.supply.markerBtn = true; T.render();
        T.say("Last step: choose who starts. That player is the " + w("starting player") + " and takes the " + w("starting player marker") + ", the token with a 1. Let's say it's you: tap the marker.");
        await T.act(function (a) { return a.kind === "marker" || (a.kind === "fac" ? "The displays are ready. Now tap the starting player marker." : false); }, '[data-act="marker"]');
        var r = T.table.rects(["ma"]);
        T.table.opt.supply.marker = false; T.table.opt.markerMine = true; T.render();
        await T.table.fly([{ from: "ma", to: "pbm", html: AZ.markerHTML({ label: false }) }], r);
        T.say("You are the starting player. The table is ready to play.");
        await T.next("Finish lesson");
        T.remember(["2, 3 or 4 players use " + F[2] + ", " + F[3] + " or " + F[4] + " factory displays.",
          "Draw " + PER + " tiles from the bag onto each factory display.",
          "Everyone uses the same board side and starts on 0. The starting player takes the marker."]);
      } },

    { id: "l3", title: "Take tiles", blurb: "Take one colour; the rest slides to the centre.",
      run: async function (T) {
        T.scene({ factories: [["red", "red", "blue", "yellow"], ["black", "black", "black", "white"], ["blue", "blue", "red", "red"], ["yellow", "white", "white", "black"], ["red", "yellow", "yellow", "yellow"]], centre: [], centre_marker: true },
          { factories: true, hand: true, board: false });
        T.say("<p>Players take " + w("turns") + ": a turn is one player's go. Turns go " + w("clockwise") + ", to the player on your left.</p><p>The starting player first puts the marker in the " + w("centre of the table") + ": the space inside the ring of displays.</p>");
        await T.next();
        T.table.opt.takeable = true; T.render();
        T.say("On your turn you <b>must</b> take tiles. Pick one colour on one factory display, and you take <b>every</b> tile of that colour there. Try it: tap the red tiles on display 1.");
        var a = await T.act(function (a) {
          if (a.kind === "marker") return "The marker isn't a tile. You only take it together with tiles from the centre.";
          if (a.kind === "emptyfac") return "That display is empty. Pick one with tiles.";
          return a.kind === "take" && a.src !== E.CENTRE ? true : false;
        }, '[data-act="take"][data-src="0"][data-colour="red"]');
        var info = await T.table.take(a.src, a.colour); T.check();
        T.say("You took " + AZ.plural(info.taken, a.colour + " tile") + ". The other " + AZ.plural(info.pushed, "tile") + " on display " + (a.src + 1) + " slid into the centre. That display is now empty.");
        await T.next();
        T.table.hand = null; T.render();
        T.say("Your tiles go on your board; the next lesson shows how. On a later turn, you may take from the <b>centre</b> instead. Tap a colour in the centre.");
        a = await T.act(function (a) {
          if (a.kind === "marker") return "The marker isn't a tile. Tap a tile in the centre; the marker comes along by itself.";
          if (a.kind === "emptyfac") return "That display is empty. This time, take from the centre.";
          if (a.kind === "take" && a.src !== E.CENTRE) return "This time, take from the centre of the table.";
          return a.kind === "take";
        }, '.centre [data-act="take"]');
        info = await T.table.take(a.src, a.colour); T.check();
        T.say("You took " + AZ.plural(info.taken, a.colour + " tile") + " from the centre. You were the first to take from the centre this round, so you also took the " + w("starting player marker") + ". It costs a point or two, but you go first next round.");
        await T.next();
        T.table.hand = null; T.render();
        T.say("Quick check. A display shows 2 blue tiles and 2 red tiles. What may you take?");
        await T.choose([
          { label: "One blue tile", ok: false, why: "You must take <b>all</b> tiles of the colour you pick." },
          { label: "One blue and one red", ok: false, why: "Only <b>one</b> colour per turn." },
          { label: "Both blue tiles", ok: true, why: "Yes. All tiles of one colour. The 2 red slide to the centre." }]);
        T.say("When you take from a factory display, where do its other tiles go?");
        await T.choose([
          { label: "Back in the bag", ok: false, why: "No. They stay in play for this round." },
          { label: "Into the centre", ok: true, why: "Yes. Anyone can take them from the centre later." },
          { label: "They stay on the display", ok: false, why: "No. A display is always emptied when someone takes from it." }]);
        await T.next("Finish lesson");
        T.remember(["Take <b>all</b> tiles of <b>one</b> colour, from one factory display or from the centre.",
          "The rest of that display slides into the centre.",
          "The first player to take from the centre also takes the starting player marker."]);
      } },

    { id: "l4", title: "Pattern lines", blurb: "Choose a line; see which lines are not allowed.",
      run: async function (T) {
        var b = E.makeBoard({ lines: [null, ["blue", 1], null, null, ["yellow", 2]] });
        b.wall[3][E.wallColumn(3, "red")] = "red";
        T.scene({ board: b }, { hand: true });
        T.table.hand = { colour: "red", n: 3 }; T.render();
        T.say("<p>Right after you take tiles, you put <b>all</b> of them into <b>one</b> " + w("pattern line") + ". Line 1 has 1 space, line 5 has 5.</p><p>Tiles fill a line from right to left, starting next to the wall.</p>");
        await T.next();
        T.table.opt.linesActive = true; T.table.opt.floorActive = true; T.render();
        T.say("You hold 3 red tiles. Put them in pattern line 3. (Try another line first if you like: you'll see why it doesn't work.)");
        await T.act(lineAct(T, 2), '[data-act="line"][data-line="2"]');
        await T.table.place(2); T.check();
        T.say("Pattern line 3 is full. A full line is called " + w("complete") + ". At the end of the round, each complete line moves one tile to the wall.");
        await T.next();
        T.table.hand = { colour: "blue", n: 2 }; T.render();
        T.say("Now you hold 2 blue tiles. Put them in a line where both fit, so nothing spills.");
        await T.act(lineAct(T, 3, { 1: "Pattern line 2 already has 1 blue, so it has room for only 1 more. The other tile would spill onto the floor line.", 0: "Pattern line 1 has room for only 1 tile. The other would spill onto the floor line." }), '[data-act="line"][data-line="3"]');
        await T.table.place(3); T.check();
        T.table.opt.linesActive = false; T.table.opt.floorActive = false; T.render();
        T.say("Pattern line 4 is not complete yet. That's fine: an unfinished line keeps its tiles, and you can add more blue on a later turn.");
        await T.next("Finish lesson");
        T.remember(["Put all the tiles you take into one pattern line, filling it from the right.",
          "One colour per line, and never a colour that is already in that row of your wall.",
          "Line 1 holds 1 tile, line 5 holds 5. A full line is complete."]);
      } },

    { id: "l5", title: "The floor line", blurb: "Extra tiles fall to the floor and cost points.",
      run: async function (T) {
        var b = E.makeBoard({ score: 12, lines: [["black", 1], null, ["blue", 3], ["red", 1], ["white", 2]] });
        T.scene({ board: b, factories: [], centre: ["red", "red", "red", "blue"], centre_marker: true }, { hand: true, factories: true });
        T.table.hand = { colour: "yellow", n: 4 }; T.render();
        T.say("<p>Sometimes you take more tiles than your line can hold. The extra tiles fall to the " + w("floor line") + ", filling it from the left.</p><p>Each floor space costs the points printed under it: " + E.FLOOR_VALUES.map(AZ.minus).join(" ") + ".</p>");
        await T.next();
        T.table.opt.linesActive = true; T.table.opt.floorActive = true; T.render();
        T.say("You hold 4 yellow tiles. Put them in pattern line 2.");
        await T.act(lineAct(T, 1, { floor: "That's allowed, but let's fill pattern line 2 first." }), '[data-act="line"][data-line="1"]');
        var pi = await T.table.place(1); T.check();
        T.table.opt.linesActive = false; T.table.opt.floorActive = false; T.render();
        T.say("Pattern line 2 took " + pi.placed + ". The other " + pi.to_floor + " fell to the floor line. How many points will the floor line cost you so far?");
        await T.choose(floorChoice(T.table.board().floor.length));
        T.table.opt.takeable = true; T.render();
        T.say("On a later turn, you take tiles from the centre. Tap the red tiles in the centre.");
        var a = await T.act(function (a) {
          if (a.kind === "marker") return "The marker isn't a tile. Tap the red tiles; the marker comes along by itself.";
          return a.kind === "take" ? (a.colour === "red" || "Take the red tiles this time.") : false;
        }, '[data-act="take"][data-colour="red"]');
        await T.table.take(a.src, a.colour); T.check();
        T.table.opt.takeable = false; T.table.opt.linesActive = true; T.table.opt.floorActive = true; T.render();
        T.say("You were first to take from the centre, so the " + w("starting player marker") + " went onto your floor line first. It counts like a tile there. Now put the 3 red tiles in pattern line 4.");
        await T.act(lineAct(T, 3), '[data-act="line"][data-line="3"]');
        await T.table.place(3); T.check();
        T.table.opt.linesActive = false; T.table.opt.floorActive = false; T.render();
        var n = T.table.board().floor.length;
        T.say("Your floor line now holds " + AZ.plural(n, "item") + ". How many points do you lose?");

        await T.next("Finish lesson");
        T.remember(["Tiles that don't fit fall to the floor line, from left to right.",
          "Floor spaces cost " + E.FLOOR_VALUES.map(AZ.minus).join(" ") + ": the first items are cheap, later ones hurt.",
          "The starting player marker counts as an item on the floor line."]);
      } },

    { id: "l6", title: "Tiles to the wall", blurb: "Move a tile to the wall and count its points.",
      run: async function (T) {
        var b = E.makeBoard({ score: 4, wall: [".....", "..X.X", "X....", ".X...", ".X..."], lines: [["blue", 1], ["red", 2], ["white", 3], null, null] });
        T.scene({ board: b }, { supply: { lid: 0 }, hlLines: [0, 1, 2] });
        T.say("<p>When every factory display and the centre are empty, collecting stops. Now comes " + w("wall-tiling") + ".</p><p>Each complete pattern line moves its <b>rightmost</b> tile onto the wall, to the space of the same colour in the row beside it.</p>");
        await T.next();
        T.table.opt.wallActive = true; T.render();
        T.say("Pattern line 1 is complete. Tap the wall space where its blue tile goes: row 1, the blue space.");
        await T.act(wallSpaceAct(T, 0, "blue"), '[data-act="wall"][data-r="0"][data-c="' + E.wallColumn(0, "blue") + '"]');
        T.table.opt.hlLines = [1, 2];
        var r = await T.table.tileLine(0); T.check();
        T.say("The blue tile touches no other tile across or down. A tile with no neighbours scores " + w(r.points + " point") + ".");
        await T.next();
        T.say("Pattern line 2 is complete too. Tap the space for its red tile.");
        await T.act(wallSpaceAct(T, 1, "red"), '[data-act="wall"][data-r="1"][data-c="' + E.wallColumn(1, "red") + '"]');
        T.table.opt.hlLines = [2];
        r = await T.table.tileLineQuiet(1); T.check();
        T.say("The other red tile from that line went into the " + w("box lid") + ". Now count: how many tiles are in the unbroken line across that includes the new tile? That's its points.");
        await T.choose(scoreChoice(r.detail, "Count the tiles side by side in row 2, including the new one. Stop at a gap."));
