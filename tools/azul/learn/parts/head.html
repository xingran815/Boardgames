@font-face { font-family: "AzulSymbols"; src: local("Segoe UI Symbol"), local("Apple Symbols"), local("DejaVu Sans"), local("Noto Sans Symbols 2"), local("Noto Sans Symbols"); unicode-range: U+2190-21FF, U+2300-23FF, U+2600-27BF; }
/* Layout: an Azul table. Warm parchment ground; cream panels in deep azulejo-blue frames with a thin
   ochre-gold inner line; dark-red card headings; Cinzel titles over a Caladea book face. Each screen is a
   coach panel (what to do) above a table (factory displays, centre, your hand) and your player board,
   side by side on wide screens and stacked on phones. Tile, factory, bag and box-lid colours are fixed
   component colours from docs/azul/STYLE.md; everything else is a theme token. Dark mode is the same
   table at night: deep azulejo blue with cream text and gold headings. */
:root {
  /* page surfaces */
  --bg: #efe4cf;            /* parchment table */
  --bg-2: #e4d4b6;          /* tracks, wells */
  --mottle: rgba(160, 120, 60, 0.07);
  --panel: #faf5ea;         /* cream */
  --panel-2: #f3e9d6;
  --ink: #1b2a4e;           /* body text */
  --ink-2: #68543c;         /* warm brown labels */
  --head: #9e2a22;          /* dark red card headings */
  --title: #1e3a72;         /* Cinzel titles */
  --line: #d3bf98;          /* tan rules and quiet borders */
  --frame: #1e3a72;         /* deep azulejo-blue frames */
  --gold: #c08a2e;          /* ochre-gold lines, decoration only */
  --star: #8a5a10;          /* earned stars (readable ochre) */
  --accent: #1e3a72;
  --accent-ink: #faf5ea;
  --accent-soft: #dbe6f4;
  --link: #2c5aa8;
  --hl: #b32a1e;            /* highlight red: "look here" frames */
  --good: #2d6a45;
  --good-bg: #e0ecd9;
  --bad: #a3271c;
  --bad-bg: #f6e0d6;
  --band: #1e3a72;          /* header and board header band */
  --band-ink: #faf5ea;
  --band-gold: #f4cd78;     /* gold text on deep blue */
  --plaque: #f1b852;        /* ochre score plaque */
  --plaque-ink: #1b2a4e;
  /* player board */
  --board: #faf5ea;
  --slot: #ead9be;          /* sand pattern-line slots */
  --slot-edge: #be9c68;     /* gold-tan slot edges */
  --tray: #e6d6b8;          /* tray under the wall */
  --floor-edge: #2c5aa8;    /* cobalt floor-line slots */
  --pen: #9e2a22;           /* floor penalties */
  --arrow: #1e3a72;
  --ghost: 0.36;            /* not-yet-tiled wall spaces, ~35 % strength */
  --veil: rgba(27, 42, 78, 0.55);
  --shade: rgba(120, 90, 50, 0.35);
  /* fixed component colours (STYLE.md: tiles) */
  --t-blue: #2f62ac;   --t-blue-edge: #1a3a6e;   --t-blue-mark: #b4d4f2;   --t-blue-let: #ffffff;
  --t-yellow: #e9a238; --t-yellow-edge: #9c6214; --t-yellow-mark: #c23e1e; --t-yellow-let: #5a2c00;
  --t-red: #d2492f;    --t-red-edge: #822819;    --t-red-mark: #f8dcc4;    --t-red-let: #ffffff;
  --t-black: #24272f;  --t-black-edge: #0c0e12;  --t-black-mark: #6caccc;  --t-black-let: #e8eef4;
  --t-white: #f4efe2;  --t-white-edge: #8fa8c4;  --t-white-mark: #5e9ace;  --t-white-let: #1e3a72;
  --t-marker: #fbf8ef; --t-navy: #1e3a72; --t-cobalt: #2c5aa8;
  --bag: #4f7cbe; --bag-print: #e4eaf0;
  --font-display: "Cinzel", "AzulSymbols", "Trajan Pro", "Times New Roman", serif;
  --font-body: "Caladea", "AzulSymbols", "Cambria", Georgia, "Times New Roman", serif;
  --cell: clamp(24px, 6.4vw, 38px);
  --fcell: clamp(20px, 5.2vw, 30px);

    --bg: #0f1f44; --bg-2: #0a1633; --mottle: rgba(156, 192, 227, 0.05); --panel: #172b57; --panel-2: #1d3566;
    --ink: #f3ebdb; --ink-2: #d7c6a4; --head: #f4cd78; --title: #f3ebdb; --line: #36507f; --frame: #6f93c8; --gold: #c08a2e; --star: #f4cd78;
    --accent: #9cc0e3; --accent-ink: #0f1f44; --accent-soft: #24406f; --link: #9cc0e3; --hl: #ff8f7e;
    --good: #8fd6a6; --good-bg: #183f35; --bad: #ff9c8a; --bad-bg: #4a1f2a;
    --band: #0a1633; --band-ink: #f3ebdb; --band-gold: #f4cd78; --plaque: #f1b852; --plaque-ink: #1b2a4e;
    --board: #14274f; --slot: #283f6c; --slot-edge: #8c7650; --tray: #223a6c; --floor-edge: #7fa6dc; --pen: #ff9c8a; --arrow: #9cc0e3;

  --bg: #0f1f44; --bg-2: #0a1633; --mottle: rgba(156, 192, 227, 0.05); --panel: #172b57; --panel-2: #1d3566;

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image:
    radial-gradient(ellipse at 50% 30%, transparent 55%, var(--mottle) 100%),
    radial-gradient(circle at 20% 15%, var(--mottle) 0 18%, transparent 40%),
    radial-gradient(circle at 80% 70%, var(--mottle) 0 15%, transparent 38%);
  background-attachment: fixed;
  color: var(--ink);
  font: 17px/1.5 var(--font-body);
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--band); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--hl); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; font-family: var(--font-display); font-weight: 700; line-height: 1.15; color: var(--title); }
p { margin: 0; }
b.w { color: var(--link); }
.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* house frame: cream panel, deep-blue frame, thin gold inner line */
.framed, .panel, .card, .coach, .chhead, .sheet, .hero {
  background: var(--panel); border: 2px solid var(--frame); border-radius: var(--radius);
  box-shadow: inset 0 0 0 3px var(--panel), inset 0 0 0 4px var(--gold), 0 2px 0 var(--shade);
}

/* ---------- header ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--band); color: var(--band-ink); border-bottom: 3px solid var(--gold); }
.bar .wrap { display: flex; align-items: center; gap: 8px; padding-block: 8px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: .02em; flex: 1 1 auto; min-width: 0; }
.brand > span:nth-child(2) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
@media (max-width: 560px) { .brand .where { display: none; } .brand { font-size: 16px; letter-spacing: 0; gap: 8px; } }
@media (max-width: 430px) { #homeBtn:not([hidden]) ~ .brand .brand-mark { display: none; } }
.brand .where { color: var(--band-gold); font-family: var(--font-body); font-weight: 400; font-size: 16px; letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.brand-mark { display: inline-grid; grid-template-columns: repeat(2, 10px); gap: 2px; flex: none; padding: 2px; border: 1px solid var(--gold); border-radius: 3px; }
.brand-mark i { width: 10px; height: 10px; border-radius: 2px; display: block; }
.bar .btn { background: transparent; color: var(--band-ink); border-color: color-mix(in srgb, var(--band-ink) 45%, transparent); box-shadow: none; }
.bar .btn:hover { border-color: var(--band-gold); color: var(--band-gold); }
.bar .btn.ghost { border-color: transparent; }
.bar :focus-visible { outline-color: var(--band-gold); }

/* ---------- buttons ---------- */
.btn {
  font-family: var(--font-body); font-weight: 700; font-size: 17px; letter-spacing: 0.01em;
  background: var(--panel); color: var(--ink); border: 2px solid var(--line); border-radius: 8px;
  padding: 8px 16px; min-height: 44px; cursor: pointer; box-shadow: 0 3px 0 var(--line);
  transition: transform .08s, box-shadow .08s; touch-action: manipulation; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn:hover { border-color: var(--frame); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--gold); box-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 50%, #000); }
.btn.small { font-size: 15px; padding: 5px 11px; min-height: 38px; }
.btn.ghost { background: transparent; box-shadow: none; border-color: transparent; }
.btn.ghost:hover { border-color: var(--line); }
.btn[disabled] { opacity: .5; cursor: default; }
.icon-btn { width: 42px; padding: 0; }
.row-btns { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* ---------- home ---------- */
.screen { padding-block: 18px 40px; }
.hero { display: grid; gap: 18px; padding: 44px 22px; margin-top: 4px; position: relative; overflow: hidden; }
.hero::before, .hero::after { content: ""; position: absolute; left: 4px; right: 4px; height: 22px; background: var(--azulejo) left center / 66px 11px repeat-x, var(--frame);
  border-block: 2px solid var(--gold); background-size: 132px 22px; }
.hero::before { top: 4px; border-radius: 6px 6px 0 0; }
.hero::after { bottom: 4px; border-radius: 0 0 6px 6px; }
@media (min-width: 860px) { .hero { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); align-items: center; padding-inline: 34px; } }
.hero h1 { font-size: clamp(34px, 6.6vw, 58px); letter-spacing: 0.01em; }
.hero h1 span { color: var(--head); display: inline-block; }
.hero .lede { font-size: 19px; color: var(--ink); max-width: 46ch; margin-top: 12px; }
.hero .row-btns { margin-top: 18px; }
.hero-tiles { display: grid; grid-template-columns: repeat(5, auto); gap: 5px; justify-content: center; padding: 10px;
  background: var(--tray); border: 2px solid var(--slot-edge); border-radius: 10px; width: max-content; max-width: 100%; justify-self: center; }
.hero-tiles .tile { --s: clamp(36px, 10vw, 54px); animation: settle .6s cubic-bezier(.3,1.4,.5,1) both; }
@keyframes settle { from { transform: translateY(-10px) scale(.85); } }
.map { display: grid; gap: 18px; margin-top: 26px; }
@media (min-width: 900px) { .map { grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; } }
.chapter { display: grid; gap: 10px; min-width: 0; }
.chhead { padding: 14px 16px; display: grid; gap: 6px; }
