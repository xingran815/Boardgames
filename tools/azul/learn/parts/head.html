<title>Azul Tile School</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Learn to play Azul from zero: eight hands-on lessons, seven scoring puzzles and two quick-fire practice games.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: a glazed-tile workshop. A sticky header bar; each screen is a coach panel (what to do) above a
   table (factory displays, centre, your hand) and your player board. Side by side on wide screens, stacked on phones.
   Tile fills are fixed (docs/azul/STYLE.md); everything else is a theme token. */
:root {
  --bg: #edf1f8;
  --bg-2: #dfe6f2;
  --grout: rgba(31, 66, 140, 0.07);
  --panel: #ffffff;
  --panel-2: #eef2fa;
  --ink: #142449;
  --ink-2: #4b5b80;
  --line: #c3cee2;
  --edge: #8d9cbc;
  --accent: #1f55c0;
  --accent-ink: #ffffff;
  --accent-soft: #dbe5fb;
  --gold: #d29a10;
  --good: #11795a;
  --good-bg: #d8f2e8;
  --bad: #b5372f;
  --bad-bg: #fbe3e0;
  --board: #f6f1e7;
  --board-rim: #d9cdb5;
  --slot: #e7dfcf;
  --factory: #d9b38c;
  --factory-rim: #a87d52;
  --veil: rgba(16, 26, 54, 0.55);
  --t-blue: #2f6fb5;
  --t-yellow: #e8b730;
  --t-red: #c8423a;
  --t-black: #2a2d34;
  --t-white: #eef1f4;
  --t-white-rim: #9aa4b1;
  --t-mark-light: #ffffff;
  --t-mark-dark: #1d2330;
  --font-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --cell: clamp(24px, 6.4vw, 38px);
  --fcell: clamp(20px, 5.2vw, 30px);
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1528; --bg-2: #131e38; --grout: rgba(140, 170, 255, 0.06); --panel: #16213b; --panel-2: #1c2a4a;
    --ink: #e8eefb; --ink-2: #a6b4d4; --line: #2f4068; --edge: #08101f; --accent: #7aa2ff; --accent-ink: #0a1430;
    --accent-soft: #22335c; --gold: #f2c34b; --good: #52d3a3; --good-bg: #123b33; --bad: #ff8073; --bad-bg: #44202a;
    --board: #22304f; --board-rim: #34466f; --slot: #2b3a5d; --factory: #c9a27a; --factory-rim: #8e6943; --veil: rgba(3, 7, 18, 0.72);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1528; --bg-2: #131e38; --grout: rgba(140, 170, 255, 0.06); --panel: #16213b; --panel-2: #1c2a4a;
  --ink: #e8eefb; --ink-2: #a6b4d4; --line: #2f4068; --edge: #08101f; --accent: #7aa2ff; --accent-ink: #0a1430;
  --accent-soft: #22335c; --gold: #f2c34b; --good: #52d3a3; --good-bg: #123b33; --bad: #ff8073; --bad-bg: #44202a;
  --board: #22304f; --board-rim: #34466f; --slot: #2b3a5d; --factory: #c9a27a; --factory-rim: #8e6943; --veil: rgba(3, 7, 18, 0.72);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--grout) 1px, transparent 1px),
    linear-gradient(90deg, var(--grout) 1px, transparent 1px);
  background-size: 44px 44px;
  color: var(--ink);
  font: 16px/1.5 var(--font-body);
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--panel); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; font-family: var(--font-display); font-weight: 600; line-height: 1.15; }
p { margin: 0; }
b.w { color: var(--accent); }
.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- header ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; gap: 8px; padding-block: 8px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 600; font-size: 18px; flex: 1 1 auto; min-width: 0; }
.brand > span:nth-child(2) { white-space: nowrap; }
@media (max-width: 560px) { .brand .where { display: none; } }
.brand .where { color: var(--ink-2); font-weight: 500; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.brand-mark { display: inline-grid; grid-template-columns: repeat(2, 9px); gap: 2px; flex: none; }
.brand-mark i { width: 9px; height: 9px; border-radius: 2px; display: block; }

/* ---------- buttons ---------- */
.btn {
  font-family: var(--font-display); font-weight: 600; font-size: 16px; letter-spacing: 0.01em;
  background: var(--panel); color: var(--ink); border: 2px solid var(--line); border-radius: 10px;
  padding: 8px 16px; min-height: 44px; cursor: pointer; box-shadow: 0 3px 0 var(--line);
  transition: transform .08s, box-shadow .08s; touch-action: manipulation; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 55%, #000); }
.btn.small { font-size: 14px; padding: 5px 11px; min-height: 38px; }
.btn.ghost { background: transparent; box-shadow: none; border-color: transparent; }
.btn[disabled] { opacity: .5; cursor: default; }
.icon-btn { width: 42px; padding: 0; }
.row-btns { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* ---------- home ---------- */
.screen { padding-block: 18px 40px; }
.hero { display: grid; gap: 18px; padding-block: 18px 8px; }
@media (min-width: 860px) { .hero { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); align-items: center; } }
.hero h1 { font-size: clamp(36px, 7vw, 60px); font-weight: 700; letter-spacing: -0.01em; }
.hero h1 span { color: var(--accent); }
.hero .lede { font-size: 18px; color: var(--ink-2); max-width: 46ch; margin-top: 10px; }
.hero .row-btns { margin-top: 16px; }
.hero-tiles { display: grid; grid-template-columns: repeat(5, auto); gap: 6px; justify-content: center; padding: 18px;
  background: var(--board); border: 2px solid var(--board-rim); border-radius: 16px; width: max-content; max-width: 100%; justify-self: center; }
.hero-tiles .tile { --s: clamp(36px, 10vw, 54px); animation: settle .6s cubic-bezier(.3,1.4,.5,1) both; }
@keyframes settle { from { transform: translateY(-10px) scale(.85); } }
.map { display: grid; gap: 18px; margin-top: 26px; }
@media (min-width: 900px) { .map { grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; } }
.chapter { display: grid; gap: 10px; min-width: 0; }
.chhead { padding: 14px 16px; border-radius: var(--radius); background: var(--panel); border: 2px solid var(--line); display: grid; gap: 6px; }
.chhead .eyebrow { font-family: var(--font-display); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
.chhead h2 { font-size: 24px; }
.chhead p { color: var(--ink-2); font-size: 15px; }
.meter { height: 8px; border-radius: 99px; background: var(--bg-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--good); border-radius: 99px; transition: width .4s; }
.nodes { display: grid; gap: 8px; }
.node { width: 100%; display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; text-align: left;
  padding: 9px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--panel); cursor: pointer; box-shadow: 0 3px 0 var(--line); }
.node:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.node .n { grid-row: span 2; width: 40px; height: 40px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 600;
  border-radius: 9px; background: var(--panel-2); border: 2px solid var(--line); font-size: 17px; }
.node .nm { font-family: var(--font-display); font-weight: 600; font-size: 17px; line-height: 1.2; min-width: 0; }
.node .ds { color: var(--ink-2); font-size: 14px; line-height: 1.3; grid-column: 2; min-width: 0; }
.node .st { grid-row: span 2; grid-column: 3; font-size: 15px; color: var(--gold); white-space: nowrap; letter-spacing: 1px; }
.node.done .n { background: var(--good); border-color: var(--good); color: var(--panel); }
.node.next { border-color: var(--accent); }
.node.next .n { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.node.locked { opacity: .55; }
.locknote { display: grid; gap: 8px; padding: 12px 14px; border: 2px dashed var(--line); border-radius: 10px; font-size: 15px; color: var(--ink-2); }
.locknote .btn { justify-self: start; }
.foot { margin-top: 26px; color: var(--ink-2); font-size: 13px; display: grid; gap: 8px; }
.foot .row-btns { gap: 6px; }

/* ---------- lesson / puzzle layout ---------- */
.shead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 12px; }
.shead .eyebrow { font-family: var(--font-display); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); width: 100%; }
.shead h2 { font-size: clamp(22px, 4.4vw, 30px); flex: 1 1 auto; min-width: 0; }
.dots { display: flex; gap: 5px; flex-wrap: wrap; }
.dots i { width: 10px; height: 10px; border-radius: 3px; background: var(--line); display: block; }
.dots i.on { background: var(--accent); }
.dots i.done { background: var(--good); }
.coach { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 61px); z-index: 10; background: var(--panel); border: 2px solid var(--accent);
  border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 10px; box-shadow: 0 6px 18px -10px var(--veil); margin-bottom: 14px; }
.coach .say { font-size: 17px; line-height: 1.45; max-width: 70ch; }
.coach .say p + p { margin-top: 6px; }
.coach .msg { font-size: 15px; padding: 7px 10px; border-radius: 8px; background: var(--bad-bg); color: var(--ink); border-left: 4px solid var(--bad); }
.coach .msg.ok { background: var(--good-bg); border-left-color: var(--good); }
.coach .choices { display: flex; flex-wrap: wrap; gap: 8px; }
.coach .choices .btn { min-width: 56px; }
.coach .choices .btn.wrong { border-color: var(--bad); color: var(--bad); }
.coach .choices .btn.right { border-color: var(--good); background: var(--good-bg); }
@media (max-width: 640px) { .coach .say { font-size: 16px; } .coach { padding: 10px 12px; } }
.stage { display: grid; gap: 14px; }
@media (min-width: 920px) { .stage { grid-template-columns: auto minmax(0, 1fr); align-items: start; } .stage > .boardcol { order: -1; } }
.table { display: grid; gap: 12px; min-width: 0; align-content: start; }
.panel { background: var(--panel); border: 2px solid var(--line); border-radius: var(--radius); padding: 12px; min-width: 0; }
.ptitle { font-family: var(--font-display); font-weight: 600; font-size: 14px; color: var(--ink-2); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 8px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.ptitle .cnt { text-transform: none; letter-spacing: 0; font-weight: 500; }

/* ---------- tiles ---------- */
.tile { --s: var(--cell); width: var(--s); height: var(--s); border-radius: 18%; position: relative; display: inline-block; flex: none;
  background: var(--fill); color: var(--mark); box-shadow: inset 0 calc(var(--s) * -0.08) 0 rgba(0,0,0,.2), inset 0 calc(var(--s) * 0.05) 0 rgba(255,255,255,.25);
  vertical-align: middle; }
.tile svg { position: absolute; inset: 22%; width: 56%; height: 56%; display: block; }
.tile::after { content: attr(data-l); position: absolute; left: 7%; top: 2%; font: 700 calc(var(--s) * 0.3)/1 var(--font-body); }
.tile.c-blue { --fill: var(--t-blue); --mark: var(--t-mark-light); }
.tile.c-yellow { --fill: var(--t-yellow); --mark: var(--t-mark-dark); }
.tile.c-red { --fill: var(--t-red); --mark: var(--t-mark-light); }
.tile.c-black { --fill: var(--t-black); --mark: var(--t-mark-light); }
.tile.c-white { --fill: var(--t-white); --mark: var(--t-mark-dark); outline: 1.5px solid var(--t-white-rim); outline-offset: -1.5px; }
.tile.marker { --fill: var(--t-white); --mark: var(--t-mark-dark); outline: 2px solid var(--gold); outline-offset: -2px; display: inline-grid; place-items: center;
  font: 700 calc(var(--s) * .6)/1 var(--font-display); }
.tile.marker::after { content: none; }
.tile.ghost { opacity: .26; box-shadow: none; }
.tile.ghost::after { opacity: .9; }
.tile.sm { --s: var(--fcell); }
.tile.xs { --s: 22px; }
.tile.lift { transform: translateY(-4px); box-shadow: 0 0 0 3px var(--accent), 0 6px 10px -4px var(--veil); }
.hole { --s: var(--cell); width: var(--s); height: var(--s); border-radius: 18%; display: inline-block; border: 2px dashed var(--board-rim); background: var(--slot); flex: none; }

/* ---------- factories & centre ---------- */
.factories { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.factory { --d: calc(var(--fcell) * 2 + 26px); width: var(--d); height: var(--d); border-radius: 50%; background: var(--factory);
  border: 4px solid var(--factory-rim); display: grid; grid-template-columns: repeat(2, var(--fcell)); gap: 4px; align-content: center; justify-content: center;
  position: relative; padding: 0; box-shadow: inset 0 -4px 0 rgba(0,0,0,.12); }
.factory .fno { position: absolute; bottom: -9px; left: 50%; translate: -50% 0; font: 600 12px/1 var(--font-display); background: var(--panel); color: var(--ink-2);
  border: 1px solid var(--line); border-radius: 99px; padding: 2px 6px; }
.factory.empty { opacity: .8; }
button.factory, button.tilebtn, .tilebtn { cursor: pointer; }
.tilebtn { padding: 0; border: 0; background: none; border-radius: 18%; display: inline-block; line-height: 0; }
.tilebtn:disabled { cursor: default; }
.centre { display: flex; flex-wrap: wrap; gap: 5px; min-height: calc(var(--fcell) + 22px); align-items: center; align-content: center; justify-content: center;
  border-radius: 14px; border: 2px dashed var(--line); padding: 10px; background: var(--panel-2); }
.centre .none { color: var(--ink-2); font-size: 14px; }
.hand { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 44px; }
.hand .lbl { color: var(--ink-2); font-size: 15px; }
.hand .tiles { display: flex; gap: 4px; flex-wrap: wrap; }
.supply { display: flex; flex-wrap: wrap; gap: 10px; }
.pile { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel); font-size: 15px; min-height: 48px; }
button.pile { cursor: pointer; }
.pile .ico { width: 34px; height: 34px; display: block; flex: none; }
.pile .num { font-family: var(--font-display); font-weight: 600; font-variant-numeric: tabular-nums; }
.palette { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.palette .tilebtn .tile { --s: 48px; }
.palette figure { margin: 0; display: grid; justify-items: center; gap: 4px; font-size: 14px; color: var(--ink-2); }

/* ---------- player board ---------- */
.pboard { background: var(--board); border: 3px solid var(--board-rim); border-radius: 16px; padding: 10px; display: grid; gap: 10px; width: max-content; max-width: 100%; justify-self: center; }
.pb-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pb-top .who { font-family: var(--font-display); font-weight: 600; font-size: 15px; color: var(--ink-2); }
.scorebox { display: inline-flex; align-items: baseline; gap: 6px; font-family: var(--font-display); font-weight: 600; padding: 3px 10px; border-radius: 8px; background: var(--panel); border: 2px solid var(--board-rim); }
.scorebox .v { font-size: 20px; font-variant-numeric: tabular-nums; min-width: 2ch; text-align: right; }
.scorebox .k { font-size: 13px; color: var(--ink-2); }
.pb-main { display: grid; grid-template-columns: auto auto auto; gap: 6px; align-items: start; }
.lines, .wall { display: grid; gap: 3px; }
.pline { display: flex; justify-content: flex-end; gap: 3px; padding: 0; border: 0; background: none; border-radius: 6px; position: relative; }
button.pline { cursor: pointer; }
button.pline:hover .hole, button.pline:focus-visible .hole { border-color: var(--accent); }
.pline .lno { position: absolute; left: 0; top: 50%; translate: 0 -50%; font: 600 12px/1 var(--font-display); color: var(--ink-2); }
.wall { grid-template-columns: repeat(5, var(--cell)); padding-left: 6px; border-left: 2px solid var(--board-rim); }
.wcell { padding: 0; border: 0; background: none; line-height: 0; border-radius: 18%; position: relative; }
button.wcell { cursor: pointer; }
.wcell.ring::before { content: ""; position: absolute; inset: -3px; border: 3px dashed var(--accent); border-radius: 24%; z-index: 1; }
.wcell.run-h .tile, .wcell.run-v .tile { box-shadow: 0 0 0 3px var(--gold); }
.wcell.pick .tile { box-shadow: 0 0 0 3px var(--good); }
.floor { display: grid; grid-template-columns: repeat(7, var(--cell)); gap: 3px; padding: 0; border: 0; background: none; justify-content: start; }
button.floor { cursor: pointer; }
.floorwrap { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 8px; align-items: center; }
.floorwrap .flabel { font: 600 12px/1.1 var(--font-display); color: var(--ink-2); text-transform: uppercase; letter-spacing: .05em; }
.fspace { display: grid; gap: 2px; justify-items: center; }
.fspace .pen { font: 600 12px/1 var(--font-display); color: var(--bad); font-variant-numeric: tabular-nums; }
.area { outline: 0; }
button.area { cursor: pointer; padding: 0; border: 0; background: none; border-radius: 8px; text-align: inherit; }
button.area:hover, button.area:focus-visible { box-shadow: 0 0 0 3px var(--accent-soft); }
.hl { box-shadow: 0 0 0 3px var(--gold) !important; border-radius: 8px; }

/* goal pulse: where to look */
.goal { animation: goal 1.4s ease-in-out infinite; border-radius: 10px; }
@keyframes goal { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 0%, transparent); } 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 55%, transparent); } }
.factory.goal { border-radius: 50%; }
.tilebtn.goal { border-radius: 18%; }

/* ---------- result / remember cards ---------- */
.card { background: var(--panel); border: 2px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; }
.remember { border-color: var(--gold); }
.remember h3 { font-size: 24px; display: flex; align-items: center; gap: 10px; }
.remember ul { margin: 0; padding-left: 22px; display: grid; gap: 6px; font-size: 17px; }
.maths { display: grid; gap: 4px; font-variant-numeric: tabular-nums; }
.maths .ln { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-bottom: 1px dashed var(--line); }
.maths .ln span:last-child { font-family: var(--font-display); font-weight: 600; white-space: nowrap; }
.maths .ln.tot { border-bottom: 0; font-weight: 700; }
.stars { font-size: 28px; letter-spacing: 4px; color: var(--gold); line-height: 1; }
.stars .off { color: var(--line); }
.verdict { font-family: var(--font-display); font-size: 24px; font-weight: 600; }
.why { color: var(--ink-2); }
.cols2 { display: grid; gap: 14px; }
@media (min-width: 760px) { .cols2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.cols2 h4 { margin: 0 0 4px; font-family: var(--font-display); font-weight: 600; font-size: 16px; }
.tag { display: inline-block; font: 600 12px/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; padding: 4px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }

/* bridge */
.bridge { display: grid; gap: 14px; max-width: 760px; }
.bridge ol { margin: 0; padding-left: 22px; display: grid; gap: 8px; font-size: 17px; }

/* ---------- quick-fire ---------- */
.hud { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.hud .chip { padding: 6px 12px; border-radius: 99px; background: var(--panel); border: 2px solid var(--line); font-family: var(--font-display); font-weight: 600; font-variant-numeric: tabular-nums; }
@media (max-width: 480px) { .hud .chip { font-size: 14px; padding: 4px 9px; } .hud { gap: 6px; } }
.hud .lives { color: var(--bad); letter-spacing: 2px; }
.timer { height: 10px; border-radius: 99px; background: var(--bg-2); overflow: hidden; margin-bottom: 12px; }
.timer i { display: block; height: 100%; background: var(--accent); width: 100%; transform-origin: left; }
.qbox { --cell: clamp(28px, 8.4vw, 44px); display: grid; gap: 14px; justify-items: center; }
