
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <!-- Tile motifs (original, STYLE.md): drawn on a 20-unit tile; currentColor is the mark colour, --fill the tile colour. -->
    <symbol id="tile-frame" viewBox="0 0 20 20"><rect x="2.8" y="2.8" width="14.4" height="14.4" rx="1" fill="none" stroke="currentColor" stroke-opacity=".45" stroke-width=".45"/></symbol>
    <symbol id="mk-blue" viewBox="0 0 20 20"><use href="#tile-frame"/><circle cx="10" cy="10" r="3.8" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="10" cy="10" r="1.3" fill="currentColor"/></symbol>
    <symbol id="mk-yellow" viewBox="0 0 20 20"><use href="#tile-frame"/><g fill="currentColor"><circle cx="10" cy="7.4" r="2.1"/><circle cx="12.6" cy="10" r="2.1"/><circle cx="10" cy="12.6" r="2.1"/><circle cx="7.4" cy="10" r="2.1"/><circle cx="13.4" cy="13.4" r=".7"/><circle cx="13.4" cy="6.6" r=".7"/><circle cx="6.6" cy="13.4" r=".7"/><circle cx="6.6" cy="6.6" r=".7"/></g><circle cx="10" cy="10" r="1.1" style="fill:var(--fill)"/></symbol>
    <symbol id="mk-red" viewBox="0 0 20 20"><use href="#tile-frame"/><path d="M10 5.4 L14.6 10 L10 14.6 L5.4 10 Z" fill="currentColor"/><path d="M10 8.2 L11.8 10 L10 11.8 L8.2 10 Z" style="fill:var(--fill)"/></symbol>
    <symbol id="mk-black" viewBox="0 0 20 20"><use href="#tile-frame"/><g fill="currentColor"><rect x="5.6" y="9" width="8.8" height="2"/><rect x="9" y="5.6" width="2" height="8.8"/><path d="M13.4 12.3 L14.5 13.4 L13.4 14.5 L12.3 13.4 Z M13.4 4.5 L14.5 5.6 L13.4 6.7 L12.3 5.6 Z M6.6 12.3 L7.7 13.4 L6.6 14.5 L5.5 13.4 Z M6.6 4.5 L7.7 5.6 L6.6 6.7 L5.5 5.6 Z"/></g></symbol>
    <symbol id="mk-white" viewBox="0 0 20 20"><use href="#tile-frame"/><g fill="currentColor"><path d="M10 11 L11.2 13.1 L10 16.2 L8.8 13.1 Z"/><path d="M10 11 L11.2 13.1 L10 16.2 L8.8 13.1 Z" transform="rotate(45 10 10)"/><path d="M10 11 L11.2 13.1 L10 16.2 L8.8 13.1 Z" transform="rotate(90 10 10)"/><path d="M10 11 L11.2 13.1 L10 16.2 L8.8 13.1 Z" transform="rotate(135 10 10)"/><path d="M10 11 L11.2 13.1 L10 16.2 L8.8 13.1 Z" transform="rotate(180 10 10)"/><path d="M10 11 L11.2 13.1 L10 16.2 L8.8 13.1 Z" transform="rotate(225 10 10)"/><path d="M10 11 L11.2 13.1 L10 16.2 L8.8 13.1 Z" transform="rotate(270 10 10)"/><path d="M10 11 L11.2 13.1 L10 16.2 L8.8 13.1 Z" transform="rotate(315 10 10)"/><circle cx="10" cy="10" r="1"/></g></symbol>
    <!-- Bag: washed cotton blue with a cream print, cream drawstring and label plaque. -->
    <symbol id="ico-bag" viewBox="0 0 40 40">
      <path d="M13.5 12 L16 6.5 H24 L26.5 12 Z" fill="#4f7cbe"/>
      <g fill="#4f7cbe"><circle cx="15.5" cy="6.6" r="1.6"/><circle cx="18.5" cy="6" r="1.6"/><circle cx="21.5" cy="6" r="1.6"/><circle cx="24.5" cy="6.6" r="1.6"/></g>
      <ellipse cx="20" cy="25" rx="16" ry="13" fill="#4f7cbe" stroke="#1e3a72" stroke-width="1"/>
      <g fill="#e4eaf0"><path d="M8.5 22 l1 1 -1 1 -1 -1z M31.5 22 l1 1 -1 1 -1 -1z M12 33 l1 1 -1 1 -1 -1z M28 33 l1 1 -1 1 -1 -1z M20 35 l1 1 -1 1 -1 -1z"/><circle cx="9.5" cy="29" r=".9"/><circle cx="30.5" cy="29" r=".9"/><circle cx="13" cy="17" r=".9"/><circle cx="27" cy="17" r=".9"/></g>
      <rect x="13" y="11.2" width="14" height="2" rx="1" fill="#e4eaf0"/>
      <rect x="12.5" y="19.5" width="15" height="9" rx="1.6" fill="#faf5ea" stroke="#1e3a72" stroke-width=".9"/>
      <path d="M15 22 H25 M15 25 H22" stroke="#1e3a72" stroke-width="1" stroke-linecap="round"/>
    </symbol>
    <!-- Box lid: deep blue with a light-blue inner line and a sand well. -->
    <symbol id="ico-lid" viewBox="0 0 40 40">
      <rect x="2" y="9" width="36" height="24" rx="3.5" fill="#1e3a72"/>
      <rect x="3.6" y="10.6" width="32.8" height="20.8" rx="2.4" fill="none" stroke="#9cc0e3" stroke-width=".9"/>
      <rect x="6" y="14" width="28" height="15" rx="1.8" fill="#ead9be" stroke="#c08a2e" stroke-width=".9"/>
      <rect x="9" y="17" width="5" height="5" rx=".8" fill="#2f62ac"/><rect x="15.5" y="17" width="5" height="5" rx=".8" fill="#d2492f"/><rect x="22" y="17" width="5" height="5" rx=".8" fill="#e9a238"/><rect x="12" y="22.5" width="5" height="5" rx=".8" fill="#24272f"/><rect x="18.5" y="22.5" width="5" height="5" rx=".8" fill="#f4efe2" stroke="#8fa8c4" stroke-width=".5"/>
    </symbol>
  </defs>
</svg>

<header class="bar">
  <div class="wrap">
    <button class="btn small ghost icon-btn" type="button" id="homeBtn" aria-label="Back to the map" hidden>&#8592;</button>
    <div class="brand"><span class="brand-mark" aria-hidden="true"><i style="background:var(--t-blue)"></i><i style="background:var(--t-yellow)"></i><i style="background:var(--t-red)"></i><i style="background:var(--t-black)"></i></span><span>Azul Tile School</span><span class="where" id="where"></span></div>
    <button class="btn small" type="button" id="rulesBtn" aria-haspopup="dialog">Rules</button>
    <button class="btn small icon-btn" type="button" id="muteBtn" aria-pressed="false" aria-label="Sound on. Press to mute.">&#9835;</button>
  </div>
</header>

<main class="wrap" id="app">
  <section class="screen" id="home"></section>
  <section class="screen" id="lesson" hidden></section>
  <section class="screen" id="bridge" hidden></section>
  <section class="screen" id="puzzle" hidden></section>
  <section class="screen" id="rush" hidden></section>
</main>

<div class="overlay" id="rules" role="dialog" aria-modal="true" aria-labelledby="rulesTitle" hidden></div>
<div class="sr" id="live" aria-live="polite"></div>
